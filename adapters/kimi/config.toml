# Merge these entries into $KIMI_CODE_HOME/config.toml.
[[hooks]]
event = "SessionStart"
command = "bash \"$KIMI_CODE_HOME/hooks/herdr-agent-state.sh\" session"

[[hooks]]
event = "UserPromptSubmit"
command = "bash \"$KIMI_CODE_HOME/hooks/herdr-agent-state.sh\" working"

[[hooks]]
event = "PreToolUse"
command = "bash \"$KIMI_CODE_HOME/hooks/herdr-agent-state.sh\" working"

[[hooks]]
event = "PermissionRequest"
command = "bash \"$KIMI_CODE_HOME/hooks/herdr-agent-state.sh\" blocked"

[[hooks]]
event = "Stop"
command = "bash \"$KIMI_CODE_HOME/hooks/herdr-agent-state.sh\" idle"

[[hooks]]
event = "Interrupt"
command = "bash \"$KIMI_CODE_HOME/hooks/herdr-agent-state.sh\" idle"
