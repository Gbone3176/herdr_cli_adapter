# Merge these entries into ~/.kimi-code/config.toml.
[[hooks]]
event = "SessionStart"
command = "bash '$HOME/.kimi-code/hooks/herdr-agent-state.sh' session"

[[hooks]]
event = "UserPromptSubmit"
command = "bash '$HOME/.kimi-code/hooks/herdr-agent-state.sh' working"

[[hooks]]
event = "PreToolUse"
command = "bash '$HOME/.kimi-code/hooks/herdr-agent-state.sh' working"

[[hooks]]
event = "PermissionRequest"
command = "bash '$HOME/.kimi-code/hooks/herdr-agent-state.sh' blocked"

[[hooks]]
event = "Stop"
command = "bash '$HOME/.kimi-code/hooks/herdr-agent-state.sh' idle"

[[hooks]]
event = "Interrupt"
command = "bash '$HOME/.kimi-code/hooks/herdr-agent-state.sh' idle"
